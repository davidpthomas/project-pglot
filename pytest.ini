[pytest]
addopts = --strict-markers
markers =
    online: mark tests are requiring internet access.
[pytest]
# Strict mode - fail on unknown markers and config options
addopts = --strict-markers --strict-config

# Test discovery and execution options
addopts = --verbose
         --tb=short
         --maxfail=5
         --disable-warnings
         --color=yes
         --durations=10
         --cov=src
         --cov-report=html
         --cov-report=term-missing
         --cov-fail-under=80

# Test file patterns
python_files = test_*.py *_test.py tests.py
python_classes = Test* *Tests
python_functions = test_*

# Minimum Python version
minversion = 6.0

# Test paths
testpaths = tests

# Custom markers for test categorization
markers =
    # Environment markers
    online: mark tests requiring internet access
    offline: mark tests that work without internet
    slow: mark tests as slow running (> 1 second)
    fast: mark tests as fast running (< 1 second)
    
    # Integration levels
    unit: mark tests as unit tests
    integration: mark tests as integration tests
    e2e: mark tests as end-to-end tests
    smoke: mark tests as smoke tests
    
    # Feature areas
    api: mark tests related to API functionality
    database: mark tests requiring database access
    auth: mark tests related to authentication
    security: mark tests related to security features
    performance: mark tests measuring performance
    
    # Environment specific
    docker: mark tests requiring Docker
    redis: mark tests requiring Redis
    postgres: mark tests requiring PostgreSQL
    mysql: mark tests requiring MySQL
    
    # Platform specific
    linux: mark tests that only run on Linux
    windows: mark tests that only run on Windows
    macos: mark tests that only run on macOS
    
    # Test types
    regression: mark tests for regression testing
    acceptance: mark tests for acceptance criteria
    boundary: mark tests for boundary conditions
    negative: mark tests for negative scenarios
    
    # Priority levels
    critical: mark tests as critical priority
    high: mark tests as high priority
    medium: mark tests as medium priority
    low: mark tests as low priority
    
    # External dependencies
    external_api: mark tests calling external APIs
    third_party: mark tests depending on third-party services
    network: mark tests requiring network access
    
    # Development phases
    wip: mark tests as work in progress
    skip_ci: mark tests to skip in CI environment
    manual: mark tests requiring manual intervention

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout settings (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Parallel execution (requires pytest-xdist)
addopts = -n auto

# JUnit XML output for CI/CD
addopts = --junitxml=reports/junit.xml

# HTML report generation (requires pytest-html)
addopts = --html=reports/report.html --self-contained-html

# Example of environment-specific configuration
# Uncomment based on your needs:

# For Django projects
# DJANGO_SETTINGS_MODULE = myproject.settings.test
# addopts = --reuse-db --nomigrations

# For async testing (requires pytest-asyncio)
# asyncio_mode = auto

# For property-based testing (requires hypothesis)
# addopts = --hypothesis-show-statistics

# Custom collection strategy
collect_ignore = [
    "setup.py",
    "conftest.py",
    "migrations/",
    "venv/",
    ".venv/",
    "node_modules/",
]

# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL
addopts = --doctest-modules

# Cache configuration
cache_dir = .pytest_cache

# Custom test session configuration
console_output_style = progress